name: push
on:
  push:
    branches:
      - main
      - master
    tags:
      - v*
  workflow_dispatch:
    inputs:
      kubectl-wait-timeout:
        description: "kubectl wait timeout used for integration and helmchart-test targets in the Makefile (e.g. 5m)"
        required: false
        default: "20m"

# Permissions required by nested workflow
permissions:
  contents: write
  id-token: write
  packages: write
  actions: read

jobs:
  shared-operator-workflow:
    name: shared-operator-workflow
    # Fork gate: the upstream release pipeline hard-fails its setup job when
    # REGISTRY_USERNAME/REGISTRY_PASSWORD are unset (it builds AND publishes
    # operator/bundle images). This fork publishes nowhere, so every main push
    # has failed since 2026-08-22. Skipped by default; to enable image
    # publishing, set repo variable PUBLISH_OPERATOR_IMAGES=true AND the
    # REGISTRY_* secrets (COMMUNITY_OPERATOR_PAT if targeting community
    # operators). Unit/build coverage continues via pr.yaml on every PR.
    if: vars.PUBLISH_OPERATOR_IMAGES == 'true'
    uses: redhat-cop/github-workflows-operators/.github/workflows/release-operator.yml@5b0493408637600ef9c71d2321337adac65153a3 # v1.1.6
    secrets:
      COMMUNITY_OPERATOR_PAT: ${{ secrets.COMMUNITY_OPERATOR_PAT }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    with:
      PR_ACTOR: "raffaele.spazzoli@gmail.com"
      RUN_UNIT_TESTS: true
      RUN_INTEGRATION_TESTS: true
      RUN_HELMCHART_TEST: true
      GO_VERSION: ~1.26
      OPERATOR_SDK_VERSION: v1.42.3
      KUBECTL_WAIT_TIMEOUT: ${{ github.event.inputs['kubectl-wait-timeout'] != '' && github.event.inputs['kubectl-wait-timeout'] || vars.KUBECTL_WAIT_TIMEOUT != '' && vars.KUBECTL_WAIT_TIMEOUT || '20m' }}
